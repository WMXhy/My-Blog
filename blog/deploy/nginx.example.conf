# Private static upstream for the Baota reverse-proxy site.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /www/web/My-Blog/blog/current;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    location = /api/activity {
        alias /www/web/My-Blog/blog/runtime/public/activity.json;
        default_type application/json;
        expires off;
        add_header Cache-Control "no-cache, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log off;
    error_log /var/log/nginx/my-blog-error.log;
}
