name: Check source and static build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Initialize an empty content library
        run: python3 blog/init_content.py
      - name: Check Markdown and publishing
        run: python3 -m unittest discover -s blog/tests -p 'test_*.py' -v
      - name: Check activity parsing and persistence
        working-directory: blog/activity
        run: python3 -m unittest -v test_sync
      - name: Check JavaScript and the memory game
        run: |
          for script in blog/assets/*.js; do node --check "$script"; done
          node blog/tests/memory.test.cjs
      - name: Build and validate static pages
        run: |
          python3 blog/build.py
          python3 blog/validate.py
          python3 blog/publish.py --check
